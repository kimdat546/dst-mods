# Server headless tự kiểm tra mod trước khi đưa cho người chơi.
# Offline, chỉ bật đúng mod này nên lỗi hiện sạch, không lẫn mod khác.
services:
  master:
    image: dst-server-x64-test:local
    platform: linux/amd64
    container_name: dst-tbpa-test
    stdin_open: true
    env_file: [ ./test.env ]
    volumes:
      - /Users/kimdat546/Code/dst-mods/translations/dang-tien-viet/tools/test-harness/container-x64:/usr/bin/container:ro
      - ./data/Master:/var/lib/game
      - ./config/Master/modoverrides.lua:/etc/dst-config/Master/modoverrides.lua:ro
      - /Users/kimdat546/Code/dst-mods/translations/than-binh-phu-an-viet/build/than-binh-phu-an-vi:/usr/share/game/mods/than-binh-phu-an-vi:ro
    ports:
      - "11994:11994/udp"
