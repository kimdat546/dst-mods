            - paragraph [ref=e384]: Ngọc Thố sẽ không bị hiệu ứng nghịch đảo tinh thần khi ở trên mặt trăng. Tăng tốc độ di chuyển khi đứng trên nền mặt trăng (moon turf). Không bị giới hạn thời gian khi vào Quảng Hàn Cung, và sẽ không bị Hằng Nga đuổi ra ngoài ban đêm. Khi tặng quà cho Hằng Nga sẽ đạt được độ hảo cảm nhiều hơn. Có thể nhận thêm bánh trung thu từ Hằng Nga.
