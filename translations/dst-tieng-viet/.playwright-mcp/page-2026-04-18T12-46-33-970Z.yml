                - img [ref=e354]
            - paragraph [ref=e356]: Có thể tạo hang cho thỏ, cũng có thể nhặt đồ trong hang. Có thể chuột phải vào bản thân để chui xuống đất. Thời gian ở dưới đất sẽ tiêu hao rất nhiều độ đói và tinh thần. Có thể nhìn được ban đêm, cũng không thể bị tấn công và bị target khi đang độn thổ. Động đất, tử kim hồ lô, và đói sẽ khiến Ngọc Thố phải chui lên khỏi mặt đất.
            - paragraph [ref=e357]
            - heading "Đảo dược vi chức Sign in to edit" [level=3] [ref=e358]:
              - text: Đảo dược vi chức
              - link "Sign in to edit" [ref=e360] [cursor=pointer]:
