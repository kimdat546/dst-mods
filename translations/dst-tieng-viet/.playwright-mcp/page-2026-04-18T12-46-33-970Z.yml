            - paragraph [ref=e370]: Là một con thỏ, ăn chay, làm bạn với thỏ. Không sợ hoàng hôn, không sợ ban đêm. Thỏ sẽ không sợ Ngọc Thố, và Ngọc Thố có thể trực tiếp bắt thỏ. Ngọc Thố sẽ không thể giết thỏ. Khi hành trang hoặc túi có thỏ sẽ giúp Ngọc Thố phục hồi tinh thần. Nếu có thỏ chết gần đó sẽ khiến ngọc thố đau lòng và tuột tinh thần. Ngọc Thố cực kỳ thích các món ăn liên quan tới cà rốt.
