                - img [ref=e361]
            - paragraph [ref=e363]: Bản thân có một cái chày nghiền thuốc. Trong cột Myth, tiêu hao 5 no để nghiền thuốc. Có thể nghiền tối đa 2 nguyên liệu, mỗi nguyên liệu. Sau 30s, nguyên liệu sẽ chuyển hóa thành bột thuốc rơi ra ngoài, gây hiệu quả ảnh hưởng đến người chơi xung quanh. Chỉ có món chay còn tươi và nguyên liệu quý mới có thể làm thuốc. Nghiền trái cây giúp tăng máu, nghiền rau giúp tăng tinh thần.
            - paragraph [ref=e364]
