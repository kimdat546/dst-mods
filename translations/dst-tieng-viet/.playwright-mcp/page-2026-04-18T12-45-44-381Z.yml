                - img [ref=e496]
            - paragraph [ref=e498]: "- Khinh thường ma pháp: Dương Tiễn trọng thiên tôn, không ghép đồ ma pháp, cột ma pháp của Dương Tiễn bị khóa, nhưng Dương Tiễn có thể trực tiếp tạo vô tự thiên thư."
