              - text: "Ưu Điểm:"
              - link "Sign in to edit" [ref=e480] [cursor=pointer]:
                - /url: https://auth.fandom.com/signin?redirect=https%3A%2F%2Fdont-starve-game.fandom.com%2Fvi%2Fwiki%2FD%25C6%25B0%25C6%25A1ng_Ti%25E1%25BB%2585n%3Fveaction%3Dedit%26section%3D9&uselang=vi&metadata=article-registration-edit-article-section
                - img [ref=e481]
            - paragraph [ref=e483]: "- Tam Tiêm Lưỡng Nhẫn Đao: dame cơ bản 51, chuột phải kích sét hoặc tia sét có thể kích hoạt vũ khí này. Thời gian kích hoạt là nửa ngày. Thuộc tính tấn công sau khi kích hoạt là thuộc tính sét, gấp 1.5 dame cơ bản, nếu mục tiêu bị ẩm ướt sẽ là 2.5 . Vũ khí sau khi kích hoạt sẽ phát sáng. Dương Tiễn miễn nhiễm với sát thương tia sét. Sau khi kích hoạt, chuột phải dùng Khu Lôi Xiết Điện có thể dịch chuyển Dương Tiễn đến vị trí mục tiêu, và gây khoảng 100 dame vào quanh mục tiêu, đồng thời khiến mục tiêu nhiễm điện, khiến nó nhận thêm 10% dame, mục tiêu nhiễm điện sẽ cách một thời gian chịu thêm dame. Dương Tiễn đánh 6 lần vào cùng một mục tiêu sẽ tạo tia sét gây thêm 30 dame vào mục tiêu."
            - paragraph [ref=e484]: "- Thần Khuyển Hao Thiên: Dương Tiễn mang theo Hao Thiên Khuyển, Hao Thiên Khuyển có thể ngửi món đồ mà Dương Tiễn đưa cho và thu thập nó, nhưng nó sẽ không thu hoạch. Dương Tiễn có thể bấm chuột trái vuốt ve Hao Thiên Khuyển để lấy những món đồ đó. Dương Tiễn có thể chuột phải Hao Thiên Khuyển khiến nó đứng tại chỗ chờ lệnh, tay không huýt sáo có thể kêu Hao Thiên Khuyển đến bên cạnh."
            - paragraph [ref=e485]: "- Nếu Hao Thiên Khuyển không may chết, nó sẽ biến thành răng non, Dương Tiễn có thể dùng tim hồi sinh để hồi sinh nó."
            - paragraph [ref=e486]: "- Hao Thiên Khuyển là một con chó, sẽ chủ động truy bắt thỏ."
            - paragraph [ref=e487]: "- Vào đêm trăng tròn, Dương Tiễn có thể cho Hao Thiên Khuyển một viên đá mặt trăng, khiến nó biến thành Nguyệt Thạch Hao Thiên Khuyển. Sau khi tiến hóa, mặt trăng đêm đó sẽ biến thành trăng non."
            - paragraph [ref=e488]: "- Nguyệt Thạch Hao Thiên Khuyển có thể tấn công, có thể hỗ trợ Dương Tiến chiến đấu, đồng thời nó còn có thể làm thủ lĩnh của đám chó săn, khiến đám chó săn hỗ trợ mình chiến đấu. Sau khi Nguyệt Thạch Hao Thiên Khuyển chết, nó sẽ biến thành Hao Thiên Khuyển, tiến hóa lại vào đêm trăng tròn lần sau."
            - paragraph [ref=e489]: "- Thiên Nhãn Động Tất: Dương Tiễn có thể nhìn rõ ban đêm như Tôn Ngộ Không. Đồng thời khóa điểm não của mình còn 32 điểm. Kỹ năng này sẽ tiêu hao chậm độ đói vào lúc mở."
            - paragraph [ref=e490]: "- Ưng Kích Trường Không: Dương Tiễn có thể học kỹ năng này ở Linh Đài Phương Thốn Sơn, tiêu hao 25 điểm não do thám quanh bản đồ, và có thể dịch chuyển đến bên cạnh người chơi khác. Dương Tiễn có thể dùng kỹ năng gọi chim ưng, tiêu hao 1 miếng thịt nhỏ để triệu hồi một con chim ưng vận chuyển đồ đến đồng đội gần đó."
            - paragraph [ref=e491]: "- Lôi Vân: Mây của Dương Tiễn có thể phản dame vào mục tiêu tấn công Dương Tiễn, và có tỷ lệ vào trạng thái nhiễm điện."
            - paragraph [ref=e492]: "- Giáp chiến: Dương Tiễn có thể ghép 2 cái giáp đặc biệt, nguyên liệu của nó không dễ thu thập, giống giáp Tôn Ngộ Không."
