            - list [ref=e509]:
              - listitem [ref=e510]: Đặt một số moonlens ở những nơi thường xuyên đến, như base, đảo mặt trăng, đảo ốc mượn hồn, quảng hàn cung, thậm chí xây bè ngoài khơi gần vua cua và đặt moonlens lên đó. Dương Tiễn sẽ tiêu hao 75 no để dịch chuyển tức thời đến các địa điểm trên, là cách di chuyển nhanh nhất trong mod.
            - list [ref=e511]:
              - listitem [ref=e512]: Dùng Quạt Ba Tiêu, Ba Tiêu Bảo Phiến, hoặc Dương Chi Ngọc Tịnh Bình trước trận đánh nếu có thể, để "thấm ướt kẻ thù" giúp sát thương gây ra lớn hơn.
            - list [ref=e513]:
              - listitem [ref=e514]: Khác với Hỏa Nhãn Kim Tinh, Tam Nhãn Thần Mục không hao não, nên dùng khá dễ chịu, chỉ cần thủ sẵn ít đồ ăn. Khuyến khích thường xuyên dùng thay vì chế tạo đồ cung cấp ánh sáng.
            - list [ref=e515]:
              - listitem [ref=e516]: Dương Tiễn rất ít khi hao não, nên thường sẽ không cần bất kỳ đồ tăng não nào. Chỉ cần có một bình rượu đào là đủ. Nếu chưa có rượu, có thể dùng nấm xanh nấu chín thay thế.
            - list [ref=e517]:
              - listitem [ref=e518]: Hao Thiên Khuyển vô cùng lợi hại khi muốn nhặt đồ, đặc biệt là nhặt đồ trong các bối cảnh nhặt sẽ bị đánh mà không nhặt sẽ mất, ví dụ như vụn lông bearger.
            - list [ref=e519]:
              - listitem [ref=e520]: Nguyệt Thạch Hao Thiên Khuyển là một đội quân siêu mạnh. Tìm Wargs để có thêm sói tham gia đội quân. Lưu ý đội quân này sẽ ăn hết thịt rơi ra, nên cẩn thận chỉ đánh các đối tượng mà thịt rơi ra không quan trọng.
            - list [ref=e521]:
              - listitem [ref=e522]: Dương Tiễn có thể cung cấp ánh sáng cho đồng đội khi dùng Khu Lôi Xiết Điện lên Tam Tiêm Đao. Đao sẽ phát sáng đủ để tránh Charlie.
