            - heading "Đầu thai làm heo Sign in to edit" [level=3] [ref=e429]:
              - text: Đầu thai làm heo
              - link "Sign in to edit" [ref=e431] [cursor=pointer]:
                - /url: https://auth.fandom.com/signin?redirect=https%3A%2F%2Fdont-starve-game.fandom.com%2Fvi%2Fwiki%2FTr%25C6%25B0_B%25C3%25A1t_Gi%25E1%25BB%259Bi%3Fveaction%3Dedit%26section%3D2&uselang=vi&metadata=article-registration-edit-article-section
                - img [ref=e432]
            - paragraph [ref=e434]: Vì phạm thiên quy nên bị giáng xuống trần gian đầu thai làm heo, sau khi chết chỉ có thể hồi sinh bằng cách ám vào nhà heo. Nhà heo sẽ bị phá hủy sau khi Bát Giới hồi sinh.
            - paragraph [ref=e435]
            - heading "Chơi thân với heo Sign in to edit" [level=3] [ref=e436]:
              - text: Chơi thân với heo
              - link "Sign in to edit" [ref=e438] [cursor=pointer]:
                - /url: https://auth.fandom.com/signin?redirect=https%3A%2F%2Fdont-starve-game.fandom.com%2Fvi%2Fwiki%2FTr%25C6%25B0_B%25C3%25A1t_Gi%25E1%25BB%259Bi%3Fveaction%3Dedit%26section%3D3&uselang=vi&metadata=article-registration-edit-article-section
                - img [ref=e439]
            - list [ref=e441]:
              - listitem [ref=e442]: Heo nhìn thấy Bát Giới sẽ chạy theo, không bao giờ từ chối món ăn mà Bát Giới đưa. Bát Giới có thể dùng món chay để mua chuộc người heo. Khi Bát Giới gặp nguy sẽ ra tay giúp đỡ.
              - listitem [ref=e443]: Bát Giới có thể dẻo miệng với vua heo nên có cơ hội nhận thêm vàng/tiền khi đổi đồ.
            - paragraph [ref=e444]
            - heading "Giỏi nông dốt công Sign in to edit" [level=3] [ref=e445]:
              - text: Giỏi nông dốt công
              - link "Sign in to edit" [ref=e447] [cursor=pointer]:
                - /url: https://auth.fandom.com/signin?redirect=https%3A%2F%2Fdont-starve-game.fandom.com%2Fvi%2Fwiki%2FTr%25C6%25B0_B%25C3%25A1t_Gi%25E1%25BB%259Bi%3Fveaction%3Dedit%26section%3D4&uselang=vi&metadata=article-registration-edit-article-section
                - img [ref=e448]
            - list [ref=e450]:
              - listitem [ref=e451]: Bát Giới giỏi làm nông, tay không thu thập cây cỏ nông sản sẽ nhanh hơn. Bón phân sẽ giúp tăng tinh thần.
              - listitem [ref=e452]: Có thể nói chuyện được với cây và hiểu được cây cần gì.
              - listitem [ref=e453]: Tay thô không giỏi chế đồ, chế đồ khá chậm.
            - paragraph [ref=e454]
            - paragraph [ref=e455]: "(Ad: Trong bản cũ, việc bón phân tăng não hoạt động tốt. Nhưng ở udpate Reap What You Sow với ruộng và các thứ khác thì không thấy hiệu quả)"
            - heading "Ham ăn mê ngủ Sign in to edit" [level=3] [ref=e456]:
              - text: Ham ăn mê ngủ
              - link "Sign in to edit" [ref=e458] [cursor=pointer]:
                - /url: https://auth.fandom.com/signin?redirect=https%3A%2F%2Fdont-starve-game.fandom.com%2Fvi%2Fwiki%2FTr%25C6%25B0_B%25C3%25A1t_Gi%25E1%25BB%259Bi%3Fveaction%3Dedit%26section%3D5&uselang=vi&metadata=article-registration-edit-article-section
                - img [ref=e459]
            - list [ref=e461]:
              - listitem [ref=e462]: Không kén ăn, ăn kỳ món ăn nào cũng không bị giảm tinh thần. Chê đồ mặn. Ăn mặn sẽ nhận được ít lợi ích hơn.
              - listitem [ref=e463]: Ăn dưa hấu tăng cả 3 thuộc tính.
              - listitem [ref=e464]: Khi đói, sức tấn công bị giảm thảm hại, thậm chí không còn sức di chuyển.
              - listitem [ref=e465]: Trong cột survival có thể tạo ra ổ rơm để lăn ra ngủ bất kỳ lúc nào.
            - heading "Da thô thịt dày Sign in to edit" [level=3] [ref=e466]:
              - text: Da thô thịt dày
              - link "Sign in to edit" [ref=e468] [cursor=pointer]:
                - /url: https://auth.fandom.com/signin?redirect=https%3A%2F%2Fdont-starve-game.fandom.com%2Fvi%2Fwiki%2FTr%25C6%25B0_B%25C3%25A1t_Gi%25E1%25BB%259Bi%3Fveaction%3Dedit%26section%3D6&uselang=vi&metadata=article-registration-edit-article-section
                - img [ref=e469]
            - list [ref=e471]:
              - listitem [ref=e472]: Ăn càng no da càng dày, càng no phòng ngự càng cao.
              - listitem [ref=e473]: Nhìn mặt thấy ghét
              - listitem [ref=e474]: Bát giới là nhân vật lì đòn nhất nhóm, cũng là đứa bị ghét nhất nhóm. Quái sẽ ưu tiên đánh Bát Giới trước mọi nhân vật khác, và sẽ không dễ dàng tha cho Bát Giới.
            - heading "Hóa lợn Sign in to edit" [level=3] [ref=e475]:
              - text: Hóa lợn
              - link "Sign in to edit" [ref=e477] [cursor=pointer]:
                - /url: https://auth.fandom.com/signin?redirect=https%3A%2F%2Fdont-starve-game.fandom.com%2Fvi%2Fwiki%2FTr%25C6%25B0_B%25C3%25A1t_Gi%25E1%25BB%259Bi%3Fveaction%3Dedit%26section%3D7&uselang=vi&metadata=article-registration-edit-article-section
                - img [ref=e478]
            - paragraph [ref=e480]: Nhấn phím H (hoặc biểu tượng mặt Ngộ Không góc trên phải) để bật Hóa lợn. Khi biến hình sẽ rớt balo, con lợn này không thể đánh nhau nhưng có thể bơi trên biển và có 1 chút ánh sáng đủ để ko bị Charli tấn công
            - paragraph [ref=e481]
            - paragraph [ref=e482]: "(Ad: Nên ăn no trước khi định sử dụng khả năng này bơi ra biển vì trong lúc biến hình không thể thao tác bất kì vật phẩm nào)"
            - heading "Cửu Xỉ Đinh Ba Sign in to edit" [level=3] [ref=e483]:
              - text: Cửu Xỉ Đinh Ba
              - link "Sign in to edit" [ref=e485] [cursor=pointer]:
                - /url: https://auth.fandom.com/signin?redirect=https%3A%2F%2Fdont-starve-game.fandom.com%2Fvi%2Fwiki%2FTr%25C6%25B0_B%25C3%25A1t_Gi%25E1%25BB%259Bi%3Fveaction%3Dedit%26section%3D8&uselang=vi&metadata=article-registration-edit-article-section
                - img [ref=e486]
            - paragraph [ref=e488]: Cửu Xỉ Đinh Ba (bồ cào chín răng) được Bát Giới dùng làm nông. Bấm chuột phải vào mặt ruộng có thể xới đất. Tay cầm đinh ba chuột phải có thể đỡ được phần lớn sát thương trong vài giây. Phần còn lại sẽ tiêu hao độ đói của Bát Giới.
            - paragraph [ref=e489]: "(Ad: Với bản update Reap What You Sow, Bát Giới không còn đào lỗ trên đất để trồng cây được nữa, mà phải đào lỗ trên ruộng, chức năng tương tự cuốc."
            - paragraph [ref=e490]
            - heading "Prototype Mẹo Sign in to edit" [level=2] [ref=e491]:
              - generic [ref=e492]:
                - link "Prototype" [ref=e494] [cursor=pointer]:
                  - /url: /vi/wiki/Prototype
