                - text: Mẹo
              - link "Sign in to edit" [ref=e497] [cursor=pointer]:
                - /url: https://auth.fandom.com/signin?redirect=https%3A%2F%2Fdont-starve-game.fandom.com%2Fvi%2Fwiki%2FTr%25C6%25B0_B%25C3%25A1t_Gi%25E1%25BB%259Bi%3Fveaction%3Dedit%26section%3D9&uselang=vi&metadata=article-registration-edit-article-section
                - img [ref=e498]
            - list [ref=e500]:
              - listitem [ref=e501]: Nên xây base gần nhà vua heo, xây thật nhiều nhà heo để tận dụng lợi thế làm heo của Bát Giới.
              - listitem [ref=e502]: Nhớ tháo đồ khỏi tay khi thu hoạch cỏ, que, và mọi thứ nông sản.
              - listitem [ref=e503]: Vì ăn uống không làm giảm não, Bát Giới có thêm lựa chọn ăn glommer goop để tăng máu khá nhiều (40 máu + 10 no)
              - listitem [ref=e504]: Thời gian đầu, cách hồi não tốt nhất cho Bát Giới là ngủ. Sau đó có thể linh động ăn uống và mặc đồ cho lên não phù hợp.
              - listitem [ref=e505]: Bát Giới có cái mũ Mặc Lan Mão giúp giữ ấm và chịu đòn khá ghê, giá thành lại rẻ. Khuyến khích đội mũ này khi đánh nhau.
              - listitem [ref=e506]: Mặc dù chịu đòn khá tốt, Bát Giới lại có lượng dmg không cao, chỉ nên đứng tank cho người khác đánh. Nhưng phải liên tục đánh quái để dụ nó target.
              - listitem [ref=e507]: Khéo léo bật chiêu đỡ sẽ chống được 100% sát thương. Một phần làm giảm no có thể bù nhanh bằng thức ăn.
              - listitem [ref=e508]: Nếu Na Tra có Hỗn Thiên Lăng chống được dmg vật lý nhưng chịu thua dmg phép, thì Bát Giới chơi tất. Rất thích hợp để đánh các boss xài phép nhiều như Tê Ngưu Tam Đại Vương hay Klaus.
              - listitem [ref=e509]:
                - text: Khuyến khích ăn
                - generic [ref=e510]: bánh trung thu ngũ cốc
                - text: trước khi đánh boss để không giảm độ đói, nhờ vậy chịu đòn tốt hơn.
