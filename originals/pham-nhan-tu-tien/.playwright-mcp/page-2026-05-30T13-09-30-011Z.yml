                  - link "绿煌剑" [ref=e203] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=248548470&content_type=Article&match_order=1&q=%E7%BB%BF%E7%85%8C%E5%89%91&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3ODAzMTkzNjgsInEiOiLnu7_nhYzliZEiLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoyNDg1NDg0NzAsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.YxJ9OH_poYHKZjjRAPN7D8D6562qH3wAjI3Hn4ZZiqA&zhida_source=entity
                    - text: 绿煌剑
                    - img [ref=e204]
                  - text: ：
                - text: 原为御灵宗结丹修士（假曲魂）的法宝，是韩立获得的第一件法宝。韩立炼化绿煌剑后，用来防身、飞行和斗法。
              - figure:
                - generic:
                  - img
              - paragraph [ref=e206]:
                - generic [ref=e207]:
                  - link "婆罗珠" [ref=e209] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=248548470&content_type=Article&match_order=1&q=%E5%A9%86%E7%BD%97%E7%8F%A0&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3ODAzMTkzNjgsInEiOiLlqYbnvZfnj6AiLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoyNDg1NDg0NzAsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.xpQRYyanOobf4y7AIHmORqzfv5RGAhgXHdBAaxieS5U&zhida_source=entity
                    - text: 婆罗珠
                    - img [ref=e210]
                  - text: ：
                - text: 原为极阴老祖身上的手链，在虚天殿第三关极妙幻境前赐给韩立。它穿着四个拇指大小的椭圆珠子，散发着青光，具有定身安魂的奇效。
              - paragraph [ref=e212]: 后文韩立在阴冥之地，凭此轻松过了阴风一关。此外，韩立在结婴时，它同养魂木等，一起发挥安魂的作用。
              - figure [ref=e213]:
                - img [ref=e215]
              - paragraph [ref=e216]:
                - generic [ref=e217]:
                  - link "混元钵" [ref=e219] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=248548470&content_type=Article&match_order=1&q=%E6%B7%B7%E5%85%83%E9%92%B5&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3ODAzMTkzNjgsInEiOiLmt7flhYPpkrUiLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoyNDg1NDg0NzAsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.aXBW0p7O6Aid3sFGd-ceBZ20-XKmE-Brpk44Dj4QrDk&zhida_source=entity
                    - text: 混元钵
                    - img [ref=e220]
                  - text: ：
                - text: 原为六连殿古长老的法宝，韩立用阵法围困和击杀古长老后获得。后来，韩立把它交给曲魂，混元钵被炼化后成为曲魂重要的攻击和防御手段。
              - heading "5、本命法宝" [level=2] [ref=e222]
              - paragraph [ref=e223]: 本命法宝是法宝中特殊的存在，威力相对更强。修士经过滴血认主，在体内培育本命法宝。他与神魂连通，可随主人修为增长、培育时间增长而威力增强。如果本命法宝损毁，主人也会遭到反噬。
              - figure:
                - generic:
                  - img
              - paragraph [ref=e224]:
                - generic [ref=e225]:
                  - link "朱雀环" [ref=e227] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=248548470&content_type=Article&match_order=1&q=%E6%9C%B1%E9%9B%80%E7%8E%AF&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3ODAzMTkzNjgsInEiOiLmnLHpm4Dnjq8iLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoyNDg1NDg0NzAsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.MX_Hz5ZLXy31VkT21z9V9n5zz-z5RQTP6l6qixOSSqQ&zhida_source=entity
                    - text: 朱雀环
                    - img [ref=e228]
                  - text: ：
                - text: 南宫婉的本命法宝，外表是火红圆环，是火属性法宝。南宫婉在血色禁地对战墨蛟时，在掩月宗对付师姐时均有使用，威力不小。
              - figure:
                - generic:
                  - img
              - paragraph [ref=e230]:
                - generic [ref=e231]:
                  - link "青竹蜂云剑" [ref=e233] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=248548470&content_type=Article&match_order=1&q=%E9%9D%92%E7%AB%B9%E8%9C%82%E4%BA%91%E5%89%91&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3ODAzMTkzNjgsInEiOiLpnZLnq7nonILkupHliZEiLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoyNDg1NDg0NzAsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.W7yekamSJtOdZWGN-F0iy_ctIkjv5tlqdODPNlvRVck&zhida_source=entity
                    - text: 青竹蜂云剑
                    - img [ref=e234]
                  - text: ：
                - text: 韩立的本命法宝，由七十二根金雷竹长剑组成。韩立多次炼化，先后加入了蚁后炼晶、庚精等，让青竹蜂云剑坚固无比又锋利至极。
              - paragraph [ref=e236]: 此外，银月魂魄也从狼首玉如意转移，成为青竹蜂云剑的器灵。青竹蜂云剑是韩立在人界和灵界纵横最重要的法宝。
              - heading "6、古宝" [level=2] [ref=e237]
              - paragraph [ref=e238]: 古宝是古修士们修炼的宝物。古宝神通单一，但威力一般极大，远非普通的法宝能比得上。但由于古时的炼宝之法、材料和现在的大不相同，古宝只能和法器一样随身携带着使用，无法被收入体内。
              - figure:
                - generic:
                  - img
              - paragraph [ref=e239]:
                - generic [ref=e240]:
                  - link "花篮古宝" [ref=e242] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=248548470&content_type=Article&match_order=1&q=%E8%8A%B1%E7%AF%AE%E5%8F%A4%E5%AE%9D&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3ODAzMTkzNjgsInEiOiLoirHnr67lj6Tlrp0iLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoyNDg1NDg0NzAsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.GIli6-Bye1ASLkVf_PFdLQ0Mlj057oFlqDKUWJofHLg&zhida_source=entity
                    - text: 花篮古宝
                    - img [ref=e243]
                  - text: ：
                - text: 原属于花脸怪人，他用它轻易压制和收取了胡月等人的法宝。韩立击杀他后获得，后文在收取狼首玉如意和元明灯时发挥着出人意料的作用。
              - figure:
                - generic:
                  - img
              - paragraph [ref=e245]:
                - generic [ref=e246]:
                  - link "血色披风" [ref=e248] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=248548470&content_type=Article&match_order=1&q=%E8%A1%80%E8%89%B2%E6%8A%AB%E9%A3%8E&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3ODAzMTkzNjgsInEiOiLooYDoibLmiqvpo44iLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoyNDg1NDg0NzAsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.cQ-zaNtFuLAygQE8QjqMkUjvCJgsPd930Je8iacFfp4&zhida_source=entity
                    - text: 血色披风
                    - img [ref=e249]
                  - text: ：
                - text: 虚天殿宝光阁所取的古宝。它疑似残次的顶阶古宝，速度快到能暂时逃匿元婴修士的追捕，但灵力消耗大，且容易失控。在后续的乱星海和慕兰草原中，韩立能成功跑路，血色披风功不可没。
              - figure:
                - generic:
                  - img
              - paragraph [ref=e251]: 五行环：虚天殿宝光阁所取的古宝。它有困敌和防御的作用，对战斗帮助比较大。但它对付如玄骨上人这种特殊的鬼修，毫无用处。而且对付实力高的修士，五行环也用处不大，后文在与温天仁斗法中损毁。
              - heading "7、通天灵宝仿制品" [level=2] [ref=e252]
              - paragraph [ref=e253]: 仿照通天灵宝炼制而成。虽然威能逊于正品，但也远远超出一般的法宝。
              - figure:
                - generic:
                  - img
              - paragraph [ref=e254]:
                - generic [ref=e255]:
                  - link "三焰扇" [ref=e257] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=248548470&content_type=Article&match_order=1&q=%E4%B8%89%E7%84%B0%E6%89%87&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3ODAzMTkzNjgsInEiOiLkuInnhLDmiYciLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoyNDg1NDg0NzAsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.fuUuAXGRDyT0qtrqntpuDhowdUmiw7wyIIPFUfEOxOw&zhida_source=entity
                    - text: 三焰扇
                    - img [ref=e258]
                  - text: ：
                - text: 韩立在大衍神君的指导下仿照七焰扇炼制而成，由乌凤翎、赤火蛟鳞等制作而成。它具有纯攻击性，威力巨大，后来韩立飞升灵界前留给了南宫婉。
              - figure:
                - generic:
                  - img
              - paragraph [ref=e260]:
                - generic [ref=e261]:
                  - link "平山印" [ref=e263] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=248548470&content_type=Article&match_order=1&q=%E5%B9%B3%E5%B1%B1%E5%8D%B0&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3ODAzMTkzNjgsInEiOiLlubPlsbHljbAiLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoyNDg1NDg0NzAsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.doNq3BRMPJx5JQtdIRak2sh917PAjTLPbXguJZ62sNY&zhida_source=entity
                    - text: 平山印
                    - img [ref=e264]
                  - text: ：
                - text: 是仿造掌天印炼制出来的，只有本体威能的十之一二，但是用它平山开地完全不在话下。它是大晋叶家炼制的宝物，在拍卖会上由太一门所得，后来在昆吾山中被毁。
              - figure:
                - generic:
                  - img
              - paragraph [ref=e266]:
                - generic [ref=e267]:
                  - link "万妖幡" [ref=e269] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=248548470&content_type=Article&match_order=1&q=%E4%B8%87%E5%A6%96%E5%B9%A1&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3ODAzMTkzNjgsInEiOiLkuIflppbluaEiLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoyNDg1NDg0NzAsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.tVDO44tQJBDbEg2AD8Hn1YDOUIAxWDY-AfMrSfE5UME&zhida_source=entity
                    - text: 万妖幡
                    - img [ref=e270]
                  - text: ：
                - text: 天妖幡的仿制品，在众多仿制品中威能最接近正品。它高二百余丈，通体灰白，幡面妖影重重，闪动着妖族符文，具有扭曲空间的神通。经过万妖谷万年妖气的长期浸泡，威力之大超乎想象。
              - figure:
                - generic:
                  - img
              - paragraph [ref=e272]: 除了上面，还有化仙宗年轻少女的四象尺（八灵尺仿制品）、风老怪的万刃盘、天魔宗的赤鸣鼓、小极宫的乾蓝鼎、叶家的弥天镯（映月环仿制品，疑似）等等。
              - heading "8、通天灵宝" [level=2] [ref=e273]
              - paragraph [ref=e274]: 通天灵宝，是古宝中有莫大神通的称呼。元婴修士即便拥有，也难以真正发挥其威能。
              - figure:
                - generic:
                  - img
              - paragraph [ref=e275]: 虚天鼎：被称为乱星海第一至宝，是一种通天灵宝。它防御力惊人，具有储存和转化灵气等作用。韩立得到虚天鼎后，很长一段时间都没法打开和使用，韩立在结婴后，才慢慢地炼化，开始发挥其威能。
              - figure:
                - generic:
                  - img
              - paragraph [ref=e276]: 七焰扇：在通天灵宝中排名靠后。韩立在坠魔谷探宝中获得七焰扇得炼制方法，但碍于材料难以寻觅，只能炼制其仿制品三焰扇。
              - paragraph [ref=e277]: 此外，还有八灵尺、黑风旗、天妖幡、映月环（疑似）、赤魂幡、掌天印等等，限于篇幅就不展开叙述。
              - figure:
                - generic:
                  - img
              - heading "9、玄天圣器" [level=2] [ref=e278]
              - paragraph [ref=e279]: 仿照玄天之宝炼制而成。用一些奇异材料与手段，也可以从玄天之宝中提炼少许力量，炼制出仿制品。
              - paragraph [ref=e280]: 在广寒界，海王族女子体内的玄天圣器具有探测功能，感应到韩立的玄天残刃。
              - figure:
                - generic:
                  - img
              - paragraph [ref=e281]: 此外，角蚩族青年也拥有一件玄天圣器，外表是一只通体雪白剔透的小钟，可惜在与韩立斗法中自爆损毁。
              - heading "10、玄天残宝" [level=2] [ref=e282]
              - paragraph [ref=e283]: 玄天之宝破损后形成的残片经过炼制，成为玄天残宝。灵界的大部分大乘，能够拥有一两件玄天之宝仿制品或玄天残宝护身，算是非常不错了。
              - figure:
                - generic:
                  - img
              - paragraph [ref=e284]: 玄天残刃：韩立在魔金山脉，从魔猿那得到玄天之宝的残刃。该宝物出自魔界，只要将一些梵圣真魔功蕴含的魔气注入其中，便能轻易控制。此宝威力极大，较轻松地就击杀了角蚩族青年和母魔。
              - paragraph [ref=e285]
              - figure:
                - generic:
                  - img
              - paragraph [ref=e286]: 紫言鼎：韩立从血光圣祖化身手中抢到。以宝物的变化莫测而言，紫言鼎威能明显强于玄天残刃。后文紫言鼎以一宝之力就轻易困住了两名合体期魔尊。
              - paragraph [ref=e287]: 此外，还有黄元子的巨型晶环、赤雷老祖的银色古镜、明尊的阵盘等等，也是玄天残宝。
              - figure:
                - generic:
                  - img
              - heading "11、玄天之宝" [level=2] [ref=e288]
              - paragraph [ref=e289]: 开天辟地时诞生于虚无之中的宝物，或者是由蕴含一界法则之力的灵草结出的灵果形成的。它拥有不可思议的神通，能无视一界的天地法则。玄天之宝的出世，每一次在灵界百族中都会引起一番血雨腥风。
              - figure:
                - generic:
                  - img
              - paragraph [ref=e290]: 玄天斩灵剑：在混沌万灵榜上排名第三的顶级至宝，韩立在机缘巧合中得到。剑中蕴含毁灭法则，杀伤力极强，韩立凭此斩杀众多顶级强者，但在韩立飞升仙界时被天雷击碎损毁。
              - paragraph [ref=e291]: 此外玄天之宝还有黑魔匕、化天盾、破天锤、迷天钟、星月旗、幻天境、玄天圣树、土皇钉、黄风图、银钧天书等等。
              - figure:
                - generic:
                  - img
              - paragraph [ref=e292]: 以上就是法宝的11种层次，而小说最开始的小绿瓶（掌天瓶）不在此列中，而是属于层次更高的仙器，这里不多加叙述。
              - paragraph [ref=e293]: 法宝这11种层次，关于威力大小，有这样一种普遍的看法：法器<符宝（真宝）<法宝残片<法宝<古宝<通天灵宝仿制品<通天灵宝<玄天圣器<玄天之宝。
              - figure:
                - generic:
                  - img
              - paragraph [ref=e294]: 对于一般法宝而言，这种排序大体上是没问题的。
              - paragraph [ref=e295]: 但是，对于一些特殊的法宝，需要动态和辩证去看待。如韩立的本命法宝青竹蜂云剑，其威能随着主人修为提升不断增强，从人界到灵界，再到仙界，都发挥着巨大的作用。
              - figure:
                - generic:
                  - img
              - paragraph [ref=e296]: 从另一个角度，从法宝的形成上去理解，所谓法器、法宝、古宝、玄天之宝其实是相对平行的产物：法器是炼气及以上修士就能炼制的，法宝是结丹及以上修士炼制的，古宝是古修士炼制的，玄天之宝是自然形成的（也存在人为炼制）。
              - figure:
                - generic:
                  - img
              - paragraph [ref=e297]: 小说中，它们没有严格去界定威能大小。好材料炼制的法器威能未必弱于法宝，玄天之宝也未必都胜于不断强化的本命法宝。
              - paragraph [ref=e298]:
