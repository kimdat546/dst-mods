              - paragraph [ref=e113]: 这些法宝中有通天灵宝，有古宝，有法宝，还有法器，细心的道友不禁要问，这些法宝有分类，是怎样的？威力又如何？
              - paragraph [ref=e114]:
                - text: 在小说中，法宝大致分为
                - generic [ref=e115]:
                  - text: 11种层次：法器、符宝及真宝、法宝残片、法宝、本命法宝、古宝、仿通天灵宝、通天灵宝、玄天圣器、
                  - link "玄天残宝" [ref=e117] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=248548470&content_type=Article&match_order=1&q=%E7%8E%84%E5%A4%A9%E6%AE%8B%E5%AE%9D&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3ODAzMTkzNjgsInEiOiLnjoTlpKnmrovlrp0iLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoyNDg1NDg0NzAsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.aQefxSWOdTzLpff2iXn0Odun54MrGiD8DVe0mfw-qI8&zhida_source=entity
                    - text: 玄天残宝
                    - img [ref=e118]
                  - text: 、玄天之宝
                - text: （后作《凡人修仙之仙界篇》还有更高层次的仙器，本篇文章不作细谈）。
              - figure [ref=e120]:
                - img [ref=e122]
              - paragraph [ref=e123]: 下面按顺序逐一介绍，并举例说明。
              - heading "1、法器" [level=2] [ref=e124]
              - paragraph [ref=e125]: 法器分为下、中、上、顶级，由于制作和使用的门槛都比较低，通常是炼气期和筑基期的修士在使用。当然，法器的威力一般不高。
              - figure [ref=e126]:
                - img [ref=e128]
              - paragraph [ref=e129]:
                - generic [ref=e130]:
                  - link "引魂钟" [ref=e132] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=248548470&content_type=Article&match_order=1&q=%E5%BC%95%E9%AD%82%E9%92%9F&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3ODAzMTkzNjgsInEiOiLlvJXprYLpkp8iLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoyNDg1NDg0NzAsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.FzA45sB_zZw6sQs2Eo4W9nlETssI-H7B-3YYRr9fUUw&zhida_source=entity
                    - text: 引魂钟
                    - img [ref=e133]
                  - text: ：
                - text: 小说中出现的第一件法器，是能控制铁奴（曲魂）的法宝。在七玄门，韩立打败墨大夫后，用鲜血覆面，与曲魂建立了联系，勉强能控制其行动。而在引魂钟上滴下精血，凡人同样能驱使曲魂。
              - figure:
                - generic:
                  - img
              - paragraph [ref=e135]:
                - generic [ref=e136]:
                  - text: 叶状法器和
                  - link "神风舟" [ref=e138] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=248548470&content_type=Article&match_order=1&q=%E7%A5%9E%E9%A3%8E%E8%88%9F&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3ODAzMTkzNjgsInEiOiLnpZ7po47oiJ8iLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoyNDg1NDg0NzAsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.nsYBfQaxPupDOuBn67NMQGPJViaGFFkXkv3W5pEoSXU&zhida_source=entity
                    - text: 神风舟
                    - img [ref=e139]
                  - text: ：
                - text: 韩立在黄枫谷修行期间，外出一般采用叶子状飞行法器和神风舟。
              - paragraph [ref=e141]: 前者单人用，比较普通，是低阶或出身低微修士常用的飞行法器；后者是韩立用墨蛟的蛟鳍和尾部炼制而成的，速度快，更灵活，也能容纳四五个人。
              - figure [ref=e142]:
                - img [ref=e144]
              - paragraph [ref=e145]:
                - generic [ref=e146]:
                  - link "大挪移令" [ref=e148] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=248548470&content_type=Article&match_order=1&q=%E5%A4%A7%E6%8C%AA%E7%A7%BB%E4%BB%A4&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3ODAzMTkzNjgsInEiOiLlpKfmjKrnp7vku6QiLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoyNDg1NDg0NzAsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.467ZkMbKQwTqFuxTqjQuuSjGG6oAXVMo_CC9m7AauqA&zhida_source=entity
                    - text: 大挪移令
                    - img [ref=e149]
                  - text: ：
                - text: 是古修士们进行超远距离传送时，必须具备的一个法器，能保证传送的安全，否则传送时形成的空间压力，会把人给挤压至死。韩立凭借上古传送阵和大挪移令，从天南大陆传送到了乱星海。
              - heading "2、符宝及真宝" [level=2] [ref=e151]
              - paragraph [ref=e152]: 符宝是结丹期及以上修士制作的具有符箓和法宝双重特性的特殊符箓，有“伪法宝”之称。
              - paragraph [ref=e153]: 他们取自身法宝的威能，封印到符箓之中，最多能封印法宝十分之一的威能，可以隔段时间多次炼制，属于消耗品。
              - paragraph [ref=e154]: 这种一般留给后人或徒弟用来防身和保命。低阶修士在斗法中使用，能轻松地击杀同阶修士。
              - figure [ref=e155]:
                - img [ref=e157]
              - paragraph [ref=e158]: 而真宝是最顶级的符宝，最多能封印法宝三分之一的威能。它虽然威力惊人，但却是一次性消耗品，而且只能是血脉后人才能使用。
              - figure [ref=e159]:
                - img [ref=e161]
              - paragraph [ref=e162]:
                - generic [ref=e163]:
                  - link "飞剑符宝" [ref=e165] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=248548470&content_type=Article&match_order=1&q=%E9%A3%9E%E5%89%91%E7%AC%A6%E5%AE%9D&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3ODAzMTkzNjgsInEiOiLpo57liZHnrKblrp0iLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoyNDg1NDg0NzAsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.-8eo8yptzuCKASLRS8O2X18Q8ScLddEvVJbsz7e2pPU&zhida_source=entity
                    - text: 飞剑符宝
                    - img [ref=e166]
                  - text: ：
                - text: 来自于金光上人，是未入门黄枫谷前韩立的巨大依仗，凭借此符宝，轻松击杀了意图袭击他的两个修士。
              - figure:
                - generic:
                  - img
              - paragraph [ref=e168]:
                - generic [ref=e169]:
                  - link "青冥针符宝" [ref=e171] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=248548470&content_type=Article&match_order=1&q=%E9%9D%92%E5%86%A5%E9%92%88%E7%AC%A6%E5%AE%9D&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3ODAzMTkzNjgsInEiOiLpnZLlhqXpkojnrKblrp0iLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoyNDg1NDg0NzAsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.X-8TOSahImiC6bGlzpgqkyLBtKB7SftLb__1Zd_1Rk8&zhida_source=entity
                    - text: 青冥针符宝
                    - img [ref=e172]
                  - text: ：
                - text: 是元婴老怪青易居士用本命法宝青冥针炼制而成，犀利之极，威力惊人。在虚天殿中，他送给韩立防身保命。后文韩立在对战温天仁和慕姓老者中均有所使用。
              - figure:
                - generic:
                  - img
              - paragraph [ref=e174]:
                - generic [ref=e175]:
                  - link "火鸟真宝" [ref=e177] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=248548470&content_type=Article&match_order=1&q=%E7%81%AB%E9%B8%9F%E7%9C%9F%E5%AE%9D&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3ODAzMTkzNjgsInEiOiLngavpuJ_nnJ_lrp0iLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoyNDg1NDg0NzAsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.1PBA3dE7RYyHBtk8t1AkteMub_aaS0CBN5I-Z7EBWBo&zhida_source=entity
