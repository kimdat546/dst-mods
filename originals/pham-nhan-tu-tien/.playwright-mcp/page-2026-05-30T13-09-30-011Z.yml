                    - img [ref=e178]
                  - text: ：
                - text: 在越京篇章中，师兄刘靖祭出火鸟真宝，一鼓作气，轻松地灭杀了四大血侍。而此前，黄枫谷众人与血侍斗法相持，且有伤亡，陷入僵局。
              - heading "3、法宝残片" [level=2] [ref=e180]
              - paragraph [ref=e181]: 顾名思义，即法宝损坏后剩下的部分。
              - figure [ref=e182]:
                - img [ref=e184]
              - paragraph [ref=e185]:
                - generic [ref=e186]:
                  - link "隐形破布" [ref=e188] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=248548470&content_type=Article&match_order=1&q=%E9%9A%90%E5%BD%A2%E7%A0%B4%E5%B8%83&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3ODAzMTkzNjgsInEiOiLpmpDlvaLnoLTluIMiLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoyNDg1NDg0NzAsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.zFyLDPMkfzQtiP4EMTXjPkd-PyszUlvAyssgkdH_Zr0&zhida_source=entity
                    - text: 隐形破布
                    - img [ref=e189]
                  - text: ：
                - text: 用它来罩住物体，会立即隐形，而且一丝灵气都不会外泄，同时不会妨碍灵气从外面进入。韩立在太南小会上交换所得，用来隐匿小绿瓶非常方便。
              - heading "4、法宝" [level=2] [ref=e191]
              - paragraph [ref=e192]: 设定是结丹期及以上修士才能炼制，数量稀少。修士会用丹火、婴火日夜淬炼以增加其威力，不会轻易拿出来示人。
              - figure [ref=e193]:
                - img [ref=e195]
              - paragraph [ref=e196]: 而从机缘或斗法中获得他人遗留的法宝，如果是斗法攻击类型的，必须经过长时间炼化再重新继承，但由于新主人难以做到与法宝心神完全合一，它的威力会丧失大半。
