              - paragraph [ref=e99]: （温馨提示：全文3700余字。）
              - paragraph [ref=e100]: 《凡人修仙传》中法宝是修士实力的重要组成部分，和敌人斗法时，功法、法宝、灵宠、符箓、阵法发挥着各自的作用，手段各式各样，打斗画面也精彩纷呈。本篇文章着重介绍法宝。
              - figure [ref=e101]:
                - img [ref=e103]
              - paragraph [ref=e104]:
                - text: 在最新的动画中，韩立逃离了
                - link "虚天殿" [ref=e106] [cursor=pointer]:
                  - /url: https://zhida.zhihu.com/search?content_id=248548470&content_type=Article&match_order=1&q=%E8%99%9A%E5%A4%A9%E6%AE%BF&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3ODAzMTkzNjgsInEiOiLomZrlpKnmrr8iLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoyNDg1NDg0NzAsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.tGzzFqSxHtfAERanjOGrzWN7FFv5EI0S5RLwkLZLMpQ&zhida_source=entity
                  - text: 虚天殿
                  - img [ref=e107]
                - text: ，在一个无人孤岛上，从储物袋中放出了他近段时间来收获的法宝，有虚天鼎、寒冰珠、玄天戈、五行环、
                - link "金雷竹小箭" [ref=e110] [cursor=pointer]:
                  - /url: https://zhida.zhihu.com/search?content_id=248548470&content_type=Article&match_order=1&q=%E9%87%91%E9%9B%B7%E7%AB%B9%E5%B0%8F%E7%AE%AD&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3ODAzMTkzNjgsInEiOiLph5Hpm7fnq7nlsI_nrq0iLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoyNDg1NDg0NzAsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.50Od2uLaMx7DvSA_ih6DcfT608aUbBbl09M4Tx_fTnU&zhida_source=entity
                  - text: 金雷竹小箭
                  - img [ref=e111]
                - text: 等，真是收获满满，韩立不愧是大收藏家！
              - figure:
